            "</svg>"
          );
        }

        const ICONS = {
          sun: svg(
            '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>',
          ),
          moon: svg(
            '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>',
          ),
          fullscreenEnter: svg(
            '<path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M16 21h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>',
          ),
          fullscreenExit: svg(
            '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
          ),
          menu: svg(
            '<line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/>',
          ),
          menuClose: svg(
            '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
            20,
          ),
        };

        // ─── THEME ─────────────────────────────────────────────────────────────
        function getSystemTheme() {
          return window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }

        function loadTheme() {
          const saved = localStorage.getItem("md-formatter-theme");
          state.theme =
            saved === "dark" || saved === "light" ? saved : getSystemTheme();
          applyTheme(state.theme);
        }

        function applyTheme(theme) {
          state.theme = theme;
          document.documentElement.setAttribute("data-theme", theme);
          localStorage.setItem("md-formatter-theme", theme);

          DOM.themeToggle.innerHTML = theme === "dark" ? ICONS.sun : ICONS.moon;
          DOM.themeToggle.setAttribute(
            "aria-label",
            theme === "dark" ? "Switch to light theme" : "Switch to dark theme",
          );
          DOM.themeToggle.title =
            theme === "dark"
              ? "Switch to light theme (Ctrl+Shift+D)"
              : "Switch to dark theme (Ctrl+Shift+D)";

          const hljsLink = document.getElementById("hljs-theme");
          if (hljsLink) {
            hljsLink.href = theme === "dark" ? HLJS_DARK : HLJS_LIGHT;
          }

          // Re-render Mermaid diagrams with the new theme if already loaded
          if (
            state.mermaidBlocks &&
            state.mermaidBlocks.length &&
            window.mermaid
          ) {
            renderMermaid();
          }
        }

        function toggleTheme() {
          applyTheme(state.theme === "light" ? "dark" : "light");
        }

        // ─── TOAST ─────────────────────────────────────────────────────────────
        function showToast(message, type) {
          const el = DOM.toast;
          const icon = el.querySelector(".toast-icon");
          DOM.toastMessage.textContent = message;
          el.className = "toast " + (type || "info");
          if (type === "error") icon.textContent = "❌";
          else if (type === "success") icon.textContent = "✅";
          else icon.textContent = "📌";
          el.classList.add("show");
          clearTimeout(toastTimer);
          toastTimer = setTimeout(() => el.classList.remove("show"), 4000);
        }

        // ─── FILE HANDLING ────────────────────────────────────────────────────
        function isMarkdownFile(file) {
          const ext = file.name.split(".").pop().toLowerCase();
          return ["md", "markdown"].includes(ext);
        }

        function validateFile(file) {
          if (!file) return { valid: false, error: "No file selected." };
          if (!isMarkdownFile(file)) {
            return {
              valid: false,
              error: "Please upload a .md or .markdown file.",
            };
          }
          if (file.size === 0) {
            return { valid: false, error: "The file is empty." };
          }
          if (file.size > CONFIG.maxFileSize) {
            return {
              valid: false,
              error:
                "File exceeds " +
                CONFIG.maxFileSize / 1024 / 1024 +
                "MB limit.",
            };
          }
          return { valid: true };
        }

        function readFileAsText(file) {
          return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = () => reject(new Error("Failed to read file."));
            reader.readAsText(file, "UTF-8");
          });
        }

        // ─── SECURITY / TEXT HELPERS ──────────────────────────────────────────
        function escapeHtml(value) {
          return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
        }

        function sanitizeFilename(name) {
          return (
            String(name)
              .replace(/[\\/:*?"<>|]/g, "-")
              .replace(/\s+/g, " ")
              .replace(/[.\s]+$/, "")
              .trim() || "document"
          );
        }

        function dedent(str) {
          return String(str)
            .replace(/^ {4}/gm, "")
            .trim();
        }

        // ─── MARKDOWN PROCESSING ──────────────────────────────────────────────
        // Replace leading YAML/TOML/JSON front matter with a styled div.
        function extractFrontMatter(text) {
          const yaml = /^---\r?\n([\s\S]*?)\r?\n---\s*(?:\r?\n|$)/.exec(text);
          if (yaml) {
            return {
              html:
                '<div class="md-front-matter" data-type="YAML front matter">' +
                escapeHtml(yaml[1].trim()) +
                "</div>",
              rest: text.slice(yaml[0].length),
            };
          }
          const toml = /^\+\+\+\r?\n([\s\S]*?)\r?\n\+\+\+\s*(?:\r?\n|$)/.exec(text);
          if (toml) {
            return {
              html:
                '<div class="md-front-matter" data-type="TOML front matter">' +
                escapeHtml(toml[1].trim()) +
                "</div>",
              rest: text.slice(toml[0].length),
            };
          }
          const json = /^(\{[\s\S]*?\})\s*(?:\r?\n|$)/.exec(text);
          if (json) {
            try {
              JSON.parse(json[1]);
              return {
                html:
                  '<div class="md-front-matter" data-type="JSON front matter">' +
                  escapeHtml(json[1]) +
                  "</div>",
                rest: text.slice(json[0].length),
              };
            } catch (e) {
              // Not valid JSON, treat as normal markdown.
            }
          }
          return { html: "", rest: text };
        }

        // Protect code spans/fences, then pull out $..$ and $$..$$ math into
        // placeholder tokens so Marked never treats `$` as anything special.
        function extractMath(text) {
          state.mathLatex = [];
          // 1. Protect fenced code blocks and inline code spans so `$` inside
          //    code is never interpreted as math.
          const protectedChunks = [];
          let idx = 0;
          text = text.replace(
            /```[\s\S]*?```|`[^`\n]*`/g,
            function (m) {
              protectedChunks.push(m);
              return "\u0001MD" + idx++ + "\u0001";
            },
          );
          // 2. Extract display math $$...$$ (reluctant; must terminate).
          //    Escaped `\$` is never treated as a delimiter.
          text = text.replace(
            /(?<!\\)\$\$([\s\S]+?)\$\$/g,
            function (m, inner) {
              const n = state.mathLatex.length;
              state.mathLatex.push({ latex: inner.trim(), display: true });
              return "⟦math:" + n + "⟧";
            },
          );
          // 3. Extract inline math $...$.
          text = text.replace(
            /(?<!\\)\$(?!\s)([^$\n]+?)(?<!\s)\$(?!\$)/g,
            function (m, inner) {
              const n = state.mathLatex.length;
              state.mathLatex.push({ latex: inner, display: false });
              return "⟦math:" + n + "⟧";
            },
          );
          // 4. Restore protected chunks.
          text = text.replace(/\u0001MD(\d+)\u0001/g, function (m, i) {
            return protectedChunks[Number(i)];
          });
          return text;
        }

        // Register the ==highlight== extension used by some renderers.
        if (typeof marked !== "undefined") {
          const markExtension = {
            name: "mark",
            level: "inline",
            start: function (src) {
              return src.indexOf("==");
            },
            tokenizer: function (src) {
              const rule = /^==([^=\n]+?)(?<! )==(?!=)/;
              const match = rule.exec(src);
              if (match) {
                return {
                  type: "mark",
                  raw: match[0],
                  text: match[1],
                };
              }
            },
            renderer: function (token) {
              return "<mark>" + token.text + "</mark>";
            },
          };
          marked.use({ extensions: [markExtension] });
        }

        function parseMarkdown(text) {
          try {
            marked.setOptions({
              gfm: true,
              breaks: true,
              pedantic: false,
            });
            const fm = extractFrontMatter(text);
            const mathText = extractMath(fm.rest);
            const rawHtml = marked.parse(mathText);
            const withFm = fm.html + rawHtml;
            // Pipeline: Markdown → Marked → HTML → DOMPurify → DOM → post-processing
            return DOMPurify.sanitize(withFm, {
              USE_PROFILES: { html: true },
              ADD_ATTR: ["target"],
              ADD_TAGS: ["input"],
              ADD_DATA_URI_TAGS: ["img"],
            });
          } catch (err) {
            console.error("Parse error:", err);
            throw new Error("Failed to parse Markdown: " + err.message);
          }
        }

        // ─── STATISTICS ────────────────────────────────────────────────────────
        function calculateStats() {
          // Word count is derived from the rendered document text so Markdown
          // syntax tokens are not counted. Code content contributes because it
          // is part of the rendered text.
          //
          // Math placeholders (raw LaTeX) and Mermaid loading/error labels are
          // internal UI, not document content, so they are excluded. A clone is
          // used so the live DOM is never mutated.
          const clone = DOM.markdownContent.cloneNode(true);
          clone
            .querySelectorAll(".math-marker, .mermaid-holder, .toc-list")
            .forEach((el) => el.remove());
          const text = clone.textContent.replace(/\s+/g, " ").trim();
          const words = text ? text.split(" ").length : 0;
          const headings = DOM.markdownContent.querySelectorAll(
            "h1, h2, h3, h4, h5, h6",
          ).length;
          const codeBlocks =
            DOM.markdownContent.querySelectorAll("pre code").length;
          return { words, headings, codeBlocks };
        }

        function formatReadingTime(words) {
          if (words === 0) return "0 min";
          if (words < 200) return "<1 min";
          return Math.ceil(words / 200) + " min";
        }

        function updateStats(stats) {
          DOM.statWords.textContent = stats.words;
          DOM.statHeadings.textContent = stats.headings;
          DOM.statCodeblocks.textContent = stats.codeBlocks;
          DOM.statReading.textContent = formatReadingTime(stats.words);
          state.stats = stats;
        }

        // ─── SCROLL CONTAINER ─────────────────────────────────────────────────
        function getScrollContainer() {
          return DOM.content;
        }

        function updateProgress() {
          const scroller = getScrollContainer();
          const maxScroll = scroller.scrollHeight - scroller.clientHeight;
          const progress =
            maxScroll > 0
              ? Math.min(
                  100,
                  Math.max(0, (scroller.scrollTop / maxScroll) * 100),
                )
              : 0;
          DOM.progressBar.style.width = progress + "%";
        }

        // ─── RENDER ────────────────────────────────────────────────────────────
        function renderDocument(html) {
          // NOTE: state.mathLatex is populated during parseMarkdown (extractMath)
          // and must NOT be cleared here.
          state.mathSpans = [];
          state.mermaidBlocks = [];

          DOM.markdownContent.replaceChildren();
          DOM.markdownContent.innerHTML = html;

          // External links open in a new tab with rel protection
          DOM.markdownContent
            .querySelectorAll('a[href^="http"]')
            .forEach((a) => {
              a.target = "_blank";
              a.rel = "noopener noreferrer";
            });

          // Graceful broken-image handling
          DOM.markdownContent.querySelectorAll("img").forEach((img) => {
            const mark = () => img.classList.add("broken");
            img.addEventListener("error", mark);
            if (img.complete && img.naturalWidth === 0) mark();
          });

          // Alerts → styled callouts; footnotes → real footnotes section
          postProcessAlerts();
          postProcessFootnotes();

          // ==mark== handled by the marked extension; attribute lists on
          // headings apply their #id before TOC generation.
          applyAttributeLists();

          // Replace math placeholders with markers and render KaTeX on demand
          replaceMathPlaceholders();

          // Convert emoji shortcodes in text nodes (skip code/pre/markers)
          replaceEmojiShortcodes();

          // Highlight + wrap code blocks; skip mermaid (rendered separately)
          DOM.markdownContent.querySelectorAll("pre code").forEach((block) => {
            if (block.classList.contains("language-mermaid")) {
              const pre = block.parentElement;
              const holder = document.createElement("div");
              holder.className = "mermaid-holder";
              holder.setAttribute("role", "img");
              const graph = block.textContent;
              holder.dataset.graph = graph;
              block.replaceChildren();
              pre.replaceWith(holder);
              state.mermaidBlocks.push({ holder, graph });
              return;
            }
            try {
              hljs.highlightElement(block);
            } catch (e) {
              block.classList.add("hljs");
            }
            wrapCodeBlock(block);
          });

          // Wrap tables so they scroll horizontally without overflowing the page
          DOM.markdownContent.querySelectorAll("table").forEach((table) => {
            if (!table.parentElement.classList.contains("table-wrapper")) {
              const wrapper = document.createElement("div");
              wrapper.className = "table-wrapper";
              table.parentElement.replaceChild(wrapper, table);
              wrapper.appendChild(table);
            }
          });

          // Task-list styling + interactivity
          DOM.markdownContent
            .querySelectorAll('input[type="checkbox"]')
            .forEach((cb) => {
              const li = cb.closest("li");
              if (li) li.classList.add("task-list-item");
              cb.disabled = false;
              const toggle = () =>
                li && li.classList.toggle("task-done", cb.checked);
              cb.addEventListener("change", toggle);
              toggle();
            });

          // Render math + mermaid (async, on-demand CDN loading)
          renderMath();
          renderMermaid();

          generateTOC();
          setupCopyButtons();
        }

        // ─── POST-PROCESSING (ALERTS, FOOTNOTES, MATH, EMOJI, ATTR LISTS) ────
        const ALERT_TYPES = {
          NOTE: "note",
          TIP: "tip",
          IMPORTANT: "important",
          WARNING: "warning",
          CAUTION: "caution",
        };

        function postProcessAlerts() {
          DOM.markdownContent.querySelectorAll("blockquote").forEach((bq) => {
            const firstP = bq.querySelector(":scope > p");
            if (!firstP) return;
            const m = /^\s*\[!([A-Z]+)\]\s*/.exec(firstP.textContent);
            if (m && ALERT_TYPES[m[1]]) {
              const type = ALERT_TYPES[m[1]];
              bq.classList.add("md-alert", "md-alert-" + type);
              bq.setAttribute("data-alert", m[1].toLowerCase());
              // Remove the "[!NOTE]" prefix from the first paragraph
              firstP.textContent = firstP.textContent
                .slice(m[0].length)
                .replace(/^\s*/, "");
            }
          });
        }

        function postProcessFootnotes() {
          const defs = new Map();
          const defPattern = /^\[\^([^\]]+)\]:\s?([\s\S]*)$/;

          // Collect top-level footnote definition paragraphs
          Array.prototype.slice
            .call(DOM.markdownContent.children)
            .forEach((el) => {
              if (el.tagName !== "P") return;
              const m = defPattern.exec(el.textContent);
              if (m && m[2].trim()) {
                defs.set(m[1], m[2]);
                el.remove();
              }
            });

          if (defs.size === 0) return;

          // Replace [^id] references with superscript footnote links
          const counter = {};
          const walker = document.createTreeWalker(
            DOM.markdownContent,
            NodeFilter.SHOW_TEXT,
            {
              acceptNode(node) {
                // Skip code, math markers, sup already generated
                const parent = node.parentElement;
                if (
                  parent &&
                  parent.closest("pre, code, .math-marker, sup.footref")
                )
                  return NodeFilter.FILTER_REJECT;
                return /\[\^[^\]\n]+\]/.test(node.nodeValue)
                  ? NodeFilter.FILTER_ACCEPT
                  : NodeFilter.FILTER_REJECT;
              },
            },
          );
          const textNodes = [];
          while (walker.nextNode()) textNodes.push(walker.currentNode);

          textNodes.forEach((node) => {
            const parts = node.nodeValue.split(/(\[\^[^\]\n]+\])/);
            if (parts.length === 1) return;
            const fragment = document.createDocumentFragment();
            parts.forEach((part) => {
              const ref = /^\[\^([^\]\n]+)\]$/.exec(part);
              if (ref && defs.has(ref[1])) {
                counter[ref[1]] = (counter[ref[1]] || 0) + 1;
                const id = "fn-" + ref[1] + "-" + counter[ref[1]];
                const sup = document.createElement("a");
                sup.className = "footref";
                sup.href = "#fn-def-" + ref[1];
                sup.dataset.fn = ref[1];
                sup.title = defs.get(ref[1]);
                sup.textContent = counter[ref[1]];
                fragment.appendChild(sup);
              } else {
                fragment.appendChild(document.createTextNode(part));
              }
            });
            node.parentNode.replaceChild(fragment, node);
          });

          // Build the footnotes section at the end of the document
          const section = document.createElement("div");
          section.className = "footnotes";
          const title = document.createElement("h2");
          title.textContent = "Footnotes";
          section.appendChild(title);
          const list = document.createElement("ol");
          Array.from(defs.entries()).forEach(([id, text]) => {
            const li = document.createElement("li");
            const anchor = document.createElement("a");
            anchor.href = "#fn-" + id + "-1";
            anchor.id = "fn-def-" + id;
            li.appendChild(anchor);
            // Render the footnote body as inline markdown is complex; keep
            // the raw text but bold/italic/code via light inline render.
            const body = document.createElement("span");
            body.textContent = "";
            body.innerHTML = renderInlineMd(text);
            li.appendChild(body);
            const back = document.createElement("a");
            back.className = "footref-back";
            back.href = "#fn-" + id + "-1";
            back.textContent = " ↩";
            li.appendChild(back);
            list.appendChild(li);
          });
          section.appendChild(list);
          DOM.markdownContent.appendChild(section);
        }

        function renderInlineMd(text) {
          let s = String(text)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");
          s = s
            .replace(/`([^`\n]+)`/g, function (m, c) {
              return "<code>" + c + "</code>";
            })
            .replace(/\*\*([^*\n]+)\*\*/g, function (m, c) {
              return "<strong>" + c + "</strong>";
            })
            .replace(/\*([^*\n]+)\*/g, function (m, c) {
              return "<em>" + c + "</em>";
            })
            .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (m, t, u) {
              return '<a href="' + u + '">' + t + "</a>";
            });
          return s;
        }

        function applyAttributeLists() {
          DOM.markdownContent
            .querySelectorAll("h1, h2, h3, h4, h5, h6")
            .forEach((h) => {
              const m = h.textContent.match(/(\s*)\{#([^}]+)\}\s*$/);
              if (m) {
                h.id = m[2].trim();
                const keep = h.textContent.slice(
                  0,
                  h.textContent.length - m[0].length,
                );
                h.textContent = keep.trimEnd();
              }
            });
        }

        // ─── MATH RENDERING ───────────────────────────────────────────────────
        function replaceMathPlaceholders() {
          const markerRe = /⟦math:(\d+)⟧/g;
          const walker = document.createTreeWalker(
            DOM.markdownContent,
            NodeFilter.SHOW_TEXT,
            {
              acceptNode(node) {
                markerRe.lastIndex = 0;
                return markerRe.test(node.nodeValue)
                  ? NodeFilter.FILTER_ACCEPT
                  : NodeFilter.FILTER_REJECT;
              },
            },
          );
          const textNodes = [];
          while (walker.nextNode()) textNodes.push(walker.currentNode);

          textNodes.forEach((node) => {
            const parts = node.nodeValue.split(/⟦math:(\d+)⟧/);
            // When splitting with a capture group, [text, n, text, n, text...]
            const hasMarker = parts.length > 1;
            if (!hasMarker) return;
            const fragment = document.createDocumentFragment();
            let hasDisplay = false;
            for (let i = 0; i < parts.length; i++) {
              if (i % 2 === 1) {
                const info = state.mathLatex[Number(parts[i])];
                if (info && info.display) hasDisplay = true;
                const span = document.createElement("span");
                span.className =
                  "math-marker" +
                  (info && info.display ? " math-display" : "");
                span.textContent = info ? info.latex : "⟦math:" + parts[i] + "⟧";
                if (info) span.dataset.latex = info.latex;
                span.dataset.math = parts[i];
                fragment.appendChild(span);
                state.mathSpans.push(span);
              } else if (parts[i]) {
                fragment.appendChild(document.createTextNode(parts[i]));
              }
            }
            // If this text node's paragraph held only a display-math marker,
            // promote the paragraph to a block .math-block container so KaTeX
            // display mode renders as its own centered block.
            const parent = node.parentNode;
            const next = node.nextSibling;
            parent.removeChild(node);
            parent.insertBefore(fragment, next);
            if (
              hasDisplay &&
              parent.tagName === "P" &&
              parent.childNodes.length === 1 &&
              parent.firstChild.classList &&
              parent.firstChild.classList.contains("math-display")
            ) {
              const div = document.createElement("div");
              div.className = "math-block";
              while (parent.firstChild) div.appendChild(parent.firstChild);
              parent.parentNode.replaceChild(div, parent);
            }
          });
        }

        async function renderMath() {
          if (state.mathSpans.length === 0) return;
          try {
            injectStyle(KATEX_CSS);
            await injectScript(KATEX_JS);
            const spans = state.mathSpans;
            spans.forEach((span) => {
              const info = state.mathLatex[Number(span.dataset.math)];
              if (!info || typeof window.katex === "undefined") return;
              try {
                window.katex.render(info.latex, span, {
                  displayMode: !!(info.display && span.classList.contains("math-display")),
                  throwOnError: false,
                  trust: false,
                });
              } catch (err) {
                // Leave the raw LaTeX visible on render failure.
              }
            });
          } catch (err) {
            // Offline: leave the LaTeX source text visible.
            console.warn("KaTeX failed to load:", err);
          }
        }

        // ─── MERMAID RENDERING ─────────────────────────────────────────────────
        async function renderMermaid() {
          if (state.mermaidBlocks.length === 0) return;
          try {
            await injectScript(MERMAID_JS);
            const blocks = state.mermaidBlocks;
            blocks.forEach((block) => {
              const holder = block.holder;
              holder.textContent = "Rendering diagram…";
            });
            window.mermaid.initialize({
              startOnLoad: false,
              theme: state.theme === "dark" ? "dark" : "default",
              securityLevel: "loose",
            });
            const blocks2 = state.mermaidBlocks;
            for (const block of blocks2) {
              try {
                const renderId = nextMermaidId();
                const { svg } = await window.mermaid.render(
                  renderId,
                  block.graph.trim(),
                );
                block.holder.innerHTML = svg;
              } catch (err) {
                block.holder.textContent = block.graph;
                block.holder.classList.add("mermaid-error");
                console.warn("Mermaid render failed:", err);
              }
            }
          } catch (err) {
            state.mermaidBlocks.forEach((block) => {
              block.holder.textContent = block.graph;
              block.holder.classList.add("mermaid-error");
            });
            console.warn("Mermaid failed to load:", err);
          }
        }

        // ─── EMOJI SHORTCODES ─────────────────────────────────────────────────
        function replaceEmojiShortcodes() {
          const walker = document.createTreeWalker(
            DOM.markdownContent,
            NodeFilter.SHOW_TEXT,
            {
              acceptNode(node) {
                const parent = node.parentElement;
                if (
                  parent &&
                  parent.closest("pre, code, .math-marker, .kbd, .mermaid-holder")
                )
                  return NodeFilter.FILTER_REJECT;
                return /:[A-Za-z0-9_+]+:/.test(node.nodeValue)
                  ? NodeFilter.FILTER_ACCEPT
                  : NodeFilter.FILTER_REJECT;
              },
            },
          );
          const textNodes = [];
          while (walker.nextNode()) textNodes.push(walker.currentNode);
          textNodes.forEach((node) => {
            const replaced = node.nodeValue.replace(
              /:([A-Za-z0-9_+]+):/g,
              function (m, key) {
                return EMOJI[key] || m;
              },
            );
            if (replaced !== node.nodeValue) {
              node.nodeValue = replaced;
            }
          });
        }

        // ─── CODE BLOCKS ───────────────────────────────────────────────────────
        const LANGUAGE_LABELS = {
          javascript: "JavaScript",
          js: "JavaScript",
          typescript: "TypeScript",
          ts: "TypeScript",
          html: "HTML",
          css: "CSS",
          bash: "Bash",
          shell: "Shell",
          sh: "Shell",
          python: "Python",
          py: "Python",
          json: "JSON",
          markdown: "Markdown",
          md: "Markdown",
        };

        function formatLanguage(lang) {
          return LANGUAGE_LABELS[lang.toLowerCase()] || lang;
        }

        function wrapCodeBlock(block) {
          const pre = block.parentElement;
          if (!pre) return;

          let lang = "";
          Array.prototype.forEach.call(block.classList, (cls) => {
            if (cls.indexOf("language-") === 0) {
              lang = cls.slice("language-".length);
            }
          });

          if (!pre.id) {
            pre.id =
              "code-" +
              Date.now().toString(36) +
              "-" +
              Math.random().toString(36).slice(2, 6);
          }

          const header = document.createElement("div");
          header.className = "code-header";

          const langEl = document.createElement("span");
          langEl.className = "lang";
          langEl.textContent = lang ? formatLanguage(lang) : "Plain text";

          const copyBtn = document.createElement("button");
          copyBtn.className = "copy-btn";
          copyBtn.textContent = "Copy";
          copyBtn.setAttribute("aria-label", "Copy code");
          copyBtn.dataset.copyTarget = pre.id;

          header.append(langEl, copyBtn);
          pre.parentElement.insertBefore(header, pre);
        }

        // ─── COPY BUTTONS ──────────────────────────────────────────────────────
        function setupCopyButtons() {
          DOM.markdownContent.querySelectorAll(".copy-btn").forEach((btn) => {
            btn.addEventListener("click", handleCopyClick);
          });
        }

        function fallbackCopy(text) {
          try {
            const ta = document.createElement("textarea");
            ta.value = text;
            ta.setAttribute("readonly", "");
            ta.style.position = "fixed";
            ta.style.top = "0";
            ta.style.opacity = "0";
            document.body.appendChild(ta);
            ta.select();
            const ok = document.execCommand("copy");
            document.body.removeChild(ta);
            return ok;
          } catch (e) {
            return false;
          }
        }

        async function copyText(text) {
          try {
            await navigator.clipboard.writeText(text);
            return true;
          } catch (e) {
            return fallbackCopy(text);
          }
        }

        async function handleCopyClick(e) {
          const btn = e.currentTarget;
          const pre = document.getElementById(btn.dataset.copyTarget);
          const code = pre && pre.querySelector("code");
          const text = code ? code.textContent : pre ? pre.textContent : "";
          const trimmed = text.trim();

          if (!trimmed) {
            showToast("Nothing to copy.", "error");
            return;
          }

          const ok = await copyText(trimmed);
          if (ok) {
            const original = btn.textContent;
            btn.textContent = "Copied ✓";
            btn.classList.add("copied");
            setTimeout(() => {
              btn.textContent = original;
              btn.classList.remove("copied");
            }, 2000);
          } else {
            showToast("Copy failed", "error");
          }
        }

        // ─── TABLE OF CONTENTS ─────────────────────────────────────────────────
        function createUniqueSlug(text, usedIds) {
          const base =
            text
              .toLowerCase()
              .trim()
              .replace(/[^\w\s-]/g, "")
              .replace(/\s+/g, "-")
              .replace(/-+/g, "-")
              .replace(/^-|-$/g, "") || "section";

          let slug = base;
          let counter = 2;
          while (usedIds.has(slug)) {
            slug = base + "-" + counter++;
          }
          usedIds.add(slug);
          return slug;
        }

        function generateTOC() {
          const headings = DOM.markdownContent.querySelectorAll(
            "h1, h2, h3, h4, h5, h6",
          );
          const tocList = DOM.tocList;
          tocList.replaceChildren();

          state.tocItems = [];

          if (headings.length === 0) {
            const empty = document.createElement("li");
            empty.className = "toc-empty";
            empty.textContent = "No headings found";
            tocList.appendChild(empty);
            disposeTocObserver();
            return;
          }

          const usedIds = new Set();
          const items = [];

          headings.forEach((h) => {
            const level = parseInt(h.tagName.charAt(1), 10);
            if (h.id) {
              h.id = (() => {
                const id = h.id;
                if (usedIds.has(id))
                  return createUniqueSlug(h.textContent, usedIds);
                usedIds.add(id);
                return id;
              })();
            } else {
              h.id = createUniqueSlug(h.textContent, usedIds);
            }
            items.push({
              id: h.id,
              text: h.textContent.trim(),
              level,
              element: h,
            });
          });

          state.tocItems = items;

          const root = tocList;
          const stack = [{ li: null, level: 0 }];

          items.forEach((item) => {
            while (
              stack.length > 1 &&
              stack[stack.length - 1].level >= item.level
            ) {
              stack.pop();
            }

            const parent = stack[stack.length - 1];
            let container;
            if (parent.li === null) {
              container = root;
            } else {
              let childUl = parent.li.querySelector(":scope > ul");
              if (!childUl) {
                childUl = document.createElement("ul");
                parent.li.appendChild(childUl);
              }
              container = childUl;
            }

            const li = document.createElement("li");
            const a = document.createElement("a");
            a.href = "#" + item.id;
            a.textContent = item.text;
            a.className = "level-" + item.level;
            a.dataset.target = item.id;
            a.addEventListener("click", (e) => {
              e.preventDefault();
              const target = document.getElementById(item.id);
              if (target) {
                closeTOCMobile();
                scrollToHeading(target);
                updateActiveTOC(item.id);
              }
            });

            li.appendChild(a);
            container.appendChild(li);
            stack.push({ li, level: item.level });
          });

          setupTOCScrollSpy();
        }

        function disposeTocObserver() {
          if (state.tocObserver) {
            state.tocObserver.disconnect();
            state.tocObserver = null;
          }
        }

        function setupTOCScrollSpy() {
          disposeTocObserver();
          const items = state.tocItems;
          if (items.length === 0) return;

          const observer = new IntersectionObserver(
            (entries) => {
              const visible = entries.filter((e) => e.isIntersecting);
              if (visible.length === 0) return;
              const top = visible.reduce((a, b) =>
                a.boundingClientRect.top <= b.boundingClientRect.top ? a : b,
              );
              updateActiveTOC(top.target.id);
            },
            {
              root: getScrollContainer(),
              rootMargin: "-20px 0px -70% 0px",
              threshold: 0,
            },
          );

          items.forEach((item) => observer.observe(item.element));
          state.tocObserver = observer;
        }

        function updateActiveTOC(id, options) {
          options = options || {};
          if (!id) return;

          const changed = lastActiveTOCId !== id;
          lastActiveTOCId = id;

          const links = DOM.tocList.querySelectorAll("a");
          let activeLink = null;
          links.forEach((a) => {
            const active = a.dataset.target === id;
            a.classList.toggle("active", active);
            if (active) activeLink = a;
          });

          if (
            activeLink &&
            options.center !== false &&
            changed &&
            isTOCOpen()
          ) {
            const behavior = tocNeedsInstantCenter ? "instant" : "smooth";
            tocNeedsInstantCenter = false;
            centerActiveTOCItem(activeLink, options.behavior || behavior);
          }
        }

        // ─── TOC AUTO-CENTERING ──────────────────────────────────────────────
        // Scrolls the TOC (not the document) so the active <li> approaches the
        // vertical center of the visible TOC viewport, clamped to its bounds.
        function centerActiveTOCItem(linkOrId, behavior) {
          const toc = DOM.tocNav;
          if (!toc) return;

          const link =
            typeof linkOrId === "string"
              ? toc.querySelector(
                  'a[data-target="' + CSS.escape(linkOrId) + '"]',
                )
              : linkOrId;

          if (!link) return;

          const item = link.closest("li");
          if (!item) return;

          if (toc.scrollHeight <= toc.clientHeight) return;

          const tocRect = toc.getBoundingClientRect();
          const itemRect = item.getBoundingClientRect();

          const itemCenter = itemRect.top + itemRect.height / 2;
          const tocCenter = tocRect.top + toc.clientHeight / 2;
          const delta = itemCenter - tocCenter;

          const maxScroll = toc.scrollHeight - toc.clientHeight;
          const targetScroll = Math.max(
            0,
            Math.min(toc.scrollTop + delta, maxScroll),
          );

          if (Math.abs(delta) < 20) return;

          toc.scrollTo({ top: targetScroll, behavior: behavior || "smooth" });
        }

        // True when the TOC is actually visible on screen (desktop sidebar, or
        // mobile drawer currently open). Avoids animating a hidden drawer.
        function isTOCOpen() {
          const mobile = window.matchMedia("(max-width: 820px)");
          return !mobile.matches || DOM.tocNav.classList.contains("open");
        }

        // Bring the currently active TOC item into view instantly (used when
        // the mobile drawer opens and after loading a new document).
        function revealActiveTOCItem() {
          if (!isTOCOpen()) return;
          const active = DOM.tocList.querySelector("a.active");
          if (!active) return;
          centerActiveTOCItem(active, "instant");
        }

        // Scrolls only the Markdown content container so a heading is brought
        // into view without disturbing the TOC or any ancestor scroller.
        function scrollToHeading(target) {
          const scroller = getScrollContainer();
          const scrollerRect = scroller.getBoundingClientRect();
          const targetRect = target.getBoundingClientRect();
          const targetTop =
            scroller.scrollTop +
            (targetRect.top - scrollerRect.top) -
            16;
          scroller.scrollTo({ top: Math.max(0, targetTop), behavior: "smooth" });
        }

        // ─── TOC MOBILE ────────────────────────────────────────────────────────
        function openTOCMobile() {
          DOM.tocNav.classList.add("open");
          DOM.tocOverlay.classList.add("visible");
          DOM.tocToggle.classList.add("active");
          DOM.tocToggle.setAttribute("aria-expanded", "true");
          DOM.tocToggle.setAttribute("aria-label", "Close table of contents");
          DOM.tocToggle.innerHTML = ICONS.menuClose;
          DOM.app.classList.add("toc-open");
          requestAnimationFrame(() => {
            revealActiveTOCItem();
          });
        }

        function closeTOCMobile() {
          DOM.tocNav.classList.remove("open");
          DOM.tocOverlay.classList.remove("visible");
          DOM.tocToggle.classList.remove("active");
          DOM.tocToggle.setAttribute("aria-expanded", "false");
          DOM.tocToggle.setAttribute("aria-label", "Toggle table of contents");
          DOM.tocToggle.innerHTML = ICONS.menu;
          DOM.app.classList.remove("toc-open");
        }

        function toggleTOCMobile() {
          if (DOM.tocNav.classList.contains("open")) {
            closeTOCMobile();
          } else {
            openTOCMobile();
          }
        }

        // ─── BACK TO TOP + PROGRESS ───────────────────────────────────────────
        function setupBackToTop() {
          const scroller = getScrollContainer();
          const threshold = 300;

          scroller.addEventListener(
            "scroll",
            () => {
              DOM.backToTop.classList.toggle(
                "visible",
                scroller.scrollTop > threshold,
              );
              updateProgress();
            },
            { passive: true },
          );

          DOM.backToTop.addEventListener("click", () => {
            scroller.scrollTo({ top: 0, behavior: "smooth" });
            DOM.backToTop.focus();
          });
        }

        // ─── FULLSCREEN ────────────────────────────────────────────────────────
        function updateFullscreenButton() {
          const active = Boolean(document.fullscreenElement);
          DOM.fullscreenBtn.innerHTML = active
            ? ICONS.fullscreenExit
            : ICONS.fullscreenEnter;
          DOM.fullscreenBtn.setAttribute(
            "aria-label",
            active ? "Exit fullscreen" : "Enter fullscreen",
          );
          DOM.fullscreenBtn.title = active
            ? "Exit fullscreen"
            : "Enter fullscreen";
        }

        function toggleFullscreen() {
          if (!document.fullscreenElement) {
            document.documentElement
              .requestFullscreen()
              .catch(() =>
                showToast(
                  "Fullscreen is not available in this browser.",
                  "error",
                ),
              );
          } else {
            document
              .exitFullscreen()
              .catch(() => showToast("Could not exit fullscreen.", "error"));
          }
        }

        function getExportStyles() {
          return `<style>

    .code-header .lang { color: #555 !important; }
}
</style>`;
        }

        function downloadHTML() {
          const contentHtml = DOM.markdownContent.innerHTML;
          const usesMath =
            contentHtml.indexOf("math-marker") !== -1 ||
            contentHtml.indexOf("katex") !== -1;
          const usesMermaid =
            contentHtml.indexOf("mermaid-holder") !== -1;
          const rawTitle = state.currentFile
            ? state.currentFile.name.replace(/\.[^.]+$/, "")
            : "document";
          const title = sanitizeFilename(rawTitle);
          const safeTitle = escapeHtml(title);
          const theme = state.theme;

          const standalone = `<!DOCTYPE html>
<html lang="en" data-theme="${theme}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${safeTitle} · Markdown Formatter</title>
    <link rel="stylesheet" href="${theme === "dark" ? HLJS_DARK : HLJS_LIGHT}">
    ${usesMath ? '<link rel="stylesheet" href="' + KATEX_CSS + '">' : ""}
    ${getExportStyles()}
</head>
<body>
    <main class="content">
        <div class="content-inner">
${contentHtml}
        </div>
    </main>
    <script src="${HLJS_SCRIPT}"><\/script>
    <script>
        window.addEventListener('load', function () {
            document.querySelectorAll('pre code').forEach(function (block) {
                try { hljs.highlightElement(block); } catch (e) { block.classList.add('hljs'); }
            });
        });
    <\/script>
    ${usesMath ? '<script src="' + KATEX_JS + '"><\/script>' : ""}
    ${usesMath ? "<script>window.addEventListener('load', function(){ if (window.katex) { document.querySelectorAll('.math-marker').forEach(function(el){ var tex = el.dataset.latex || el.textContent; try { if (el.classList.contains('math-display')) { katex.render(tex, el, { displayMode: true, throwOnError: false }); } else { el.removeAttribute('class'); katex.render(tex, el, { displayMode: false, throwOnError: false }); } } catch(e){} }); } });<\/script>" : ""}
    ${usesMermaid ? '<script src="' + MERMAID_JS + '"><\/script>' : ""}
    ${usesMermaid ? "<script>window.addEventListener('load', function(){ if (window.mermaid) { mermaid.initialize({ startOnLoad: false, theme: '" + (theme === "dark" ? "dark" : "default") + "', securityLevel: 'loose' }); document.querySelectorAll('.mermaid-holder').forEach(function(el, i){ if (el.querySelector('svg')) return; var graph = (el.dataset.graph || el.textContent).trim(); if (!graph) return; mermaid.render('mermaid-export-' + i, graph).then(function(res){ el.innerHTML = res.svg; }).catch(function(){}); }); } });<\/script>" : ""}
</body>
</html>`;

          const blob = new Blob([standalone], {
            type: "text/html;charset=utf-8",
          });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = title + ".html";
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          showToast(
            usesMath || usesMermaid
              ? "HTML downloaded (needs internet for math, mermaid & highlighting)"
              : "HTML downloaded (internet needed for highlighting)",
            "success",
          );
        }

        // ─── LOAD FILE ─────────────────────────────────────────────────────────
        function setLoading(loading) {
          const controls = [
            DOM.downloadBtn,
            DOM.reuploadBtn,
            DOM.themeToggle,
            DOM.fullscreenBtn,
          ];
          controls.forEach((btn) => {
            btn.disabled = loading;
          });
          DOM.app.classList.toggle("loading", loading);
        }

        function resetDocState() {
          DOM.progressBar.style.width = "0%";
          DOM.backToTop.classList.remove("visible");
          closeTOCMobile();
          state.tocItems = [];
          disposeTocObserver();
          lastActiveTOCId = null;
          tocNeedsInstantCenter = true;
        }

        async function loadFile(file) {
          const requestId = ++loadRequestId;

          const validation = validateFile(file);
          if (!validation.valid) {
            showToast(validation.error, "error");
            return;
          }

          if (file.size > CONFIG.largeFileSize) {
            showToast("Parsing Markdown…", "info");
          }
          setLoading(true);

          try {
            const content = await readFileAsText(file);

            if (requestId !== loadRequestId) return;

            if (!content.trim()) {
              setLoading(false);
              showToast(
                "The file is empty or contains only whitespace.",
                "error",
              );
              return;
            }

            resetDocState();

            state.currentFile = file;
            const html = parseMarkdown(content);

            DOM.fileName.textContent = file.name;
            DOM.emptyState.classList.add("hidden");
            DOM.app.classList.add("visible");

            renderDocument(html);
            updateStats(calculateStats());

            getScrollContainer().scrollTop = 0;

            showToast('Loaded "' + file.name + '"', "success");
          } catch (err) {
            console.error(err);
            if (requestId === loadRequestId) {
              showToast("Error loading file: " + err.message, "error");
            }
          } finally {
            if (requestId === loadRequestId) setLoading(false);
          }
        }

        // ─── SAMPLE MARKDOWN ──────────────────────────────────────────────────
        const SAMPLE_MARKDOWN = `# Git Commands

    A comprehensive guide to essential Git commands for daily development.

    ## Introduction

    Git is a distributed version control system that tracks changes in source code during software development. This guide covers the most useful commands with practical examples.

    ## Git Basics

    ### git status

    Shows the current state of your working directory and staging area.

    \`\`\`bash
    git status
    # On branch main
    # Your branch is up to date with 'origin/main'.
    # nothing to commit, working tree clean
    \`\`\`

    ### git add

    Adds changes to the staging area, preparing them for the next commit.

    \`\`\`bash
    # Add a specific file
    git add index.html

    # Add all changes
    git add .

    # Interactive mode
    git add -p
    \`\`\`

    ### git commit

    Creates a new commit with the staged changes.

    \`\`\`bash
    git commit -m "Fix: resolve login button alignment issue"

    # Amend the last commit
    git commit --amend -m "Updated commit message"
    \`\`\`

    ## Branching & Merging

    ### git branch

    List, create, or delete branches.

    \`\`\`bash
    # List all branches
    git branch

    # Create a new branch
    git branch feature/new-dashboard

    # Delete a branch
    git branch -d feature/old-feature
    \`\`\`

    ### git checkout / switch

    Switch between branches or restore working tree files.

    \`\`\`bash
    # Switch to an existing branch
    git checkout main

    # Create and switch to a new branch
    git checkout -b feature/new-feature

    # Using the newer switch command
    git switch main
    git switch -c feature/new-feature
    \`\`\`

    ### git merge

    Merges changes from one branch into the current branch.

    \`\`\`bash
    # Merge feature branch into current
    git merge feature/new-feature

    # Merge with no fast-forward
    git merge --no-ff feature/new-feature
    \`\`\`

    ## Remote Repositories

    ### git remote

    Manages connections to remote repositories.

    \`\`\`bash
    git remote -v
    # origin  https://github.com/user/repo.git (fetch)
    # origin  https://github.com/user/repo.git (push)

    git remote add upstream https://github.com/original/repo.git
    \`\`\`

    ### git push

    Uploads local commits to a remote repository.

    \`\`\`bash
    git push origin main

    # Push and set upstream
    git push -u origin feature/new-feature

    # Force push (use with caution!)
    git push --force origin main
    \`\`\`

    ### git pull

    Fetches and merges changes from a remote repository.

    \`\`\`bash
    git pull origin main

    # Pull with rebase
    git pull --rebase origin main
    \`\`\`

    ## Inspecting History

    ### git log

    Shows the commit history.

    \`\`\`bash
    # Standard log
    git log

    # One line per commit
    git log --oneline

    # Graph view
    git log --graph --oneline --all

    # Show changes
    git log -p
    \`\`\`

    ### git diff

    Shows differences between various states.

    \`\`\`bash
    # Unstaged changes
    git diff

    # Staged changes
    git diff --staged

    # Between two commits
    git diff HEAD~2..HEAD
    \`\`\`

    ## Undoing Changes

    ### git reset

    Resets the current HEAD to a specified state.

    \`\`\`bash
    git reset --soft HEAD~1

    # Keep changes in staging
    git reset --mixed HEAD~1

    # Keep changes unstaged
    git reset --hard HEAD~1

    # Discard changes entirely
    \`\`\`

    | Command | Effect |
    |---------|--------|
    | \`git reset --soft HEAD~1\` | Keep changes in staging |
    | \`git reset --mixed HEAD~1\` | Keep changes unstaged |
    | \`git reset --hard HEAD~1\` | Discard changes entirely |

    ⚠️ **Warning:** \`--hard\` discards changes permanently.

    ### git revert

    Creates a new commit that undoes a previous commit.

    \`\`\`bash
    git revert HEAD
    git revert <commit-hash>
    \`\`\`

    ## Stashing

    Temporarily save uncommitted changes.

    \`\`\`bash
    # Save changes
    git stash save "WIP: login form"

    # List stashes
    git stash list

    # Apply latest stash
    git stash pop

    # Apply without dropping
    git stash apply
    \`\`\`

    ## Aliases

    Create shortcuts for common commands.

    \`\`\`bash
    git config --global alias.co checkout
    git config --global alias.br branch
    git config --global alias.st status
    git config --global alias.unstage 'reset HEAD --'
    \`\`\`

    ## Checklist

    - [ ] Set up your Git configuration (\`git config\`)
    - [ ] Initialize a repository (\`git init\`)
    - [ ] Clone an existing repository (\`git clone\`)
    - [ ] Make your first commit
    - [ ] Create and switch to a new branch
    - [ ] Push to a remote repository
    - [ ] Open a pull request

    ---

    > **Pro Tip:** Always review your changes with \`git status\` and \`git diff\` before committing. This helps catch mistakes early.

    For more information, visit the [official Git documentation](https://git-scm.com/doc).
    `;

        // ─── LOAD EXAMPLE ──────────────────────────────────────────────────────
        function loadExample() {
          const file = new File([dedent(SAMPLE_MARKDOWN)], "git-commands.md", {
            type: "text/markdown",
          });
          loadFile(file);
        }

        // ─── SETUP UPLOAD ─────────────────────────────────────────────────────
        function clearDropFeedback() {
          DOM.dropZone.classList.remove("dragover", "invalid");
          DOM.dropHint.classList.add("hidden");
        }

        function updateDropFeedback(e) {
          const files = e.dataTransfer.files;
          const bad =
            files.length > 0 &&
            Array.prototype.some.call(files, (f) => !isMarkdownFile(f));
          DOM.dropZone.classList.toggle("invalid", bad);
          DOM.dropHint.textContent = bad
            ? "Markdown files only"
            : "Drop Markdown file to open";
          DOM.dropHint.classList.remove("hidden");
        }

        function setupUpload() {
          DOM.chooseBtn.addEventListener("click", () => DOM.fileInput.click());

          DOM.reuploadBtn.addEventListener("click", () =>
            DOM.fileInputToolbar.click(),
          );

          DOM.fileInput.addEventListener("change", (e) => {
            if (e.target.files.length > 0) loadFile(e.target.files[0]);
            e.target.value = "";
          });

          DOM.fileInputToolbar.addEventListener("change", (e) => {
            if (e.target.files.length > 0) loadFile(e.target.files[0]);
            e.target.value = "";
          });

          const dropZone = DOM.dropZone;
          let dragDepth = 0;

          dropZone.addEventListener("dragenter", (e) => {
            e.preventDefault();
            dragDepth++;
            dropZone.classList.add("dragover");
            updateDropFeedback(e);
          });

          dropZone.addEventListener("dragover", (e) => {
            e.preventDefault();
            dropZone.classList.add("dragover");
            updateDropFeedback(e);
          });

          dropZone.addEventListener("dragleave", (e) => {
            e.preventDefault();
            dragDepth = Math.max(0, dragDepth - 1);
            if (dragDepth === 0) clearDropFeedback();
          });

          dropZone.addEventListener("drop", (e) => {
            e.preventDefault();
            dragDepth = 0;
            clearDropFeedback();
            const files = e.dataTransfer.files;
            if (files.length > 0) loadFile(files[0]);
          });

          DOM.exampleBtn.addEventListener("click", loadExample);
        }

        // ─── SETUP KEYBOARD SHORTCUTS ─────────────────────────────────────────
        function setupKeyboardShortcuts() {
          document.addEventListener("keydown", (e) => {
            if (e.ctrlKey && e.key === "o") {
              e.preventDefault();
              if (DOM.app.classList.contains("visible")) {
                DOM.fileInputToolbar.click();
              } else {
                DOM.fileInput.click();
              }
            }
            if (e.ctrlKey && e.shiftKey && (e.key === "d" || e.key === "D")) {
              e.preventDefault();
              toggleTheme();
            }
          });
        }

        // ─── SETUP EVENT HANDLERS ──────────────────────────────────────────────
        function setupThemeToggle() {
          DOM.themeToggle.addEventListener("click", toggleTheme);
        }

        function setupFullscreen() {
          DOM.fullscreenBtn.addEventListener("click", toggleFullscreen);
          document.addEventListener("fullscreenchange", updateFullscreenButton);
          updateFullscreenButton();
        }

        function setupDownload() {
          DOM.downloadBtn.addEventListener("click", downloadHTML);
        }

        function setupTocToggle() {
          DOM.tocToggle.addEventListener("click", toggleTOCMobile);
          DOM.tocOverlay.addEventListener("click", () => {
            closeTOCMobile();
            DOM.tocToggle.focus();
          });
          document.addEventListener("keydown", (e) => {
            if (e.key === "Escape" && DOM.tocNav.classList.contains("open")) {
              closeTOCMobile();
              DOM.tocToggle.focus();
            }
          });
        }

        // ─── INIT ──────────────────────────────────────────────────────────────
        function init() {
          loadTheme();
          setupUpload();
          setupThemeToggle();
          setupFullscreen();
          setupDownload();
          setupTocToggle();
          setupBackToTop();
          setupKeyboardShortcuts();

          console.log("📄 Markdown Formatter ready");
        }

        // ─── RUN ──────────────────────────────────────────────────────────────
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", init);
        } else {
          init();
        }
      })();
    </script>
  </body>
</html>
