<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markdown Formatter &amp; Viewer</title>

    <!-- ===== CDN DEPENDENCIES ===== -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css"
      id="hljs-theme"
    />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <!-- ===== STYLES ===== -->
    <style>
      /* ----- CSS Variables (Light default) ----- */
      :root {
        --bg-page: #f6f8fa;
        --bg-content: #ffffff;
        --bg-toolbar: #ffffff;
        --bg-toc: #f6f8fa;
        --bg-code: #f6f8fa;
        --bg-code-block: #f6f8fa;
        --bg-code-header: #f0f2f5;
        --bg-table-stripe: #f8f9fb;
        --bg-blockquote: #f0f4ff;
        --bg-upload: #f6f8fa;
        --bg-upload-hover: #eef2f7;

        --text-primary: #1f2937;
        --text-secondary: #4b5563;
        --text-muted: #9ca3af;
        --text-heading: #0f172a;
        --text-link: #2563eb;
        --text-link-hover: #1d4ed8;
        --text-code: #d63384;
        --text-code-block: #1f2937;
        --text-success: #16a34a;
        --text-danger: #dc2626;

        --border-color: #e5e7eb;
        --border-focus: #2563eb;
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
        --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
        --shadow-lg: 0 8px 30px rgba(0, 0, 0, 0.12);

        --radius: 8px;
        --radius-lg: 12px;
        --transition: 0.2s ease;

        --max-width: 820px;
        --toc-width: 260px;
        --toolbar-height: 52px;

        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --space-5: 24px;
        --space-6: 32px;

        --font-sans:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        --font-mono:
          "SF Mono", "Cascadia Code", "Consolas", "Liberation Mono", monospace;
      }

      /* ----- Dark Mode ----- */
      [data-theme="dark"] {
        --bg-page: #0d1117;
        --bg-content: #161b22;
        --bg-toolbar: #161b22;
        --bg-toc: #0d1117;
        --bg-code: #1c2333;
        --bg-code-block: #1c2333;
        --bg-code-header: #1c2333;
        --bg-table-stripe: #1c2333;
        --bg-blockquote: #1c2333;
        --bg-upload: #161b22;
        --bg-upload-hover: #1c2333;

        --text-primary: #e6edf3;
        --text-secondary: #8b949e;
        --text-muted: #484f58;
        --text-heading: #f0f6fc;
        --text-link: #58a6ff;
        --text-link-hover: #79c0ff;
        --text-code: #f0888e;
        --text-code-block: #e6edf3;
        --text-success: #3fb950;
        --text-danger: #f85149;

        --border-color: #30363d;
        --border-focus: #58a6ff;
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
        --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.4);
        --shadow-lg: 0 8px 30px rgba(0, 0, 0, 0.5);
      }

      /* ----- Reset & Base ----- */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: var(--font-sans);
        background: var(--bg-page);
        color: var(--text-primary);
        transition:
          background var(--transition),
          color var(--transition);
        min-height: 100vh;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }

      button {
        -webkit-tap-highlight-color: transparent;
      }

      :focus-visible {
        outline: 2px solid var(--border-focus);
        outline-offset: 2px;
      }

      /* ----- Scrollbar ----- */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: var(--bg-page);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--text-muted);
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--text-secondary);
      }

      /* ----- Empty State ----- */
      #empty-state {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: var(--space-5);
      }

      .empty-container {
        text-align: center;
        max-width: 520px;
        width: 100%;
        padding: 48px 32px;
        background: var(--bg-content);
        border: 2px dashed var(--border-color);
        border-radius: var(--radius-lg);
        transition:
          background var(--transition),
          border-color var(--transition);
        position: relative;
      }

      .empty-container.dragover {
        border-color: var(--border-focus);
        background: var(--bg-upload-hover);
      }

      .empty-container.invalid {
        border-color: var(--text-danger);
        background: var(--bg-upload);
      }

      .empty-icon {
        font-size: 56px;
        line-height: 1;
        margin-bottom: var(--space-4);
        display: block;
      }

      .empty-title {
        font-size: 22px;
        font-weight: 700;
        color: var(--text-heading);
        margin-bottom: 6px;
      }

      .empty-sub {
        font-size: 14px;
        color: var(--text-secondary);
        margin-bottom: 20px;
      }

      .empty-actions {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--space-3);
      }

      .drop-hint {
        margin-top: var(--space-4);
        font-size: 13px;
        font-weight: 600;
        color: var(--text-link);
        min-height: 18px;
      }
      .empty-container.invalid .drop-hint {
        color: var(--text-danger);
      }

      .empty-hint {
        font-size: 12px;
        color: var(--text-muted);
        margin-top: var(--space-4);
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: var(--space-2);
        height: 40px;
        padding: 0 24px;
        font-size: 14px;
        font-weight: 600;
        font-family: var(--font-sans);
        border: 1px solid var(--border-color);
        border-radius: var(--radius);
        cursor: pointer;
        transition:
          background var(--transition),
          transform var(--transition),
          box-shadow var(--transition);
        background: var(--bg-upload);
        color: var(--text-primary);
        text-decoration: none;
        user-select: none;
      }

      .btn:hover {
        transform: translateY(-1px);
        box-shadow: var(--shadow-sm);
      }
      .btn:active {
        transform: translateY(0);
      }

      .btn-primary {
        background: var(--border-focus);
        color: #fff;
        border-color: var(--border-focus);
      }
      .btn-primary:hover {
        background: var(--text-link-hover);
        border-color: var(--text-link-hover);
      }

      .btn-secondary {
        background: var(--bg-content);
        color: var(--text-primary);
        border-color: var(--border-color);
      }
      .btn-secondary:hover {
        background: var(--bg-upload-hover);
      }

      .btn-icon {
        padding: 0;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: transparent;
        border: none;
        cursor: pointer;
        font-size: 18px;
        color: var(--text-secondary);
        transition:
          background var(--transition),
          color var(--transition);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .btn-icon:hover {
        background: var(--bg-upload-hover);
        color: var(--text-primary);
      }
      .btn-icon:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .btn-icon svg {
        display: block;
      }

      /* ----- Hidden file inputs ----- */
      #file-input,
      #file-input-toolbar {
        display: none;
      }

      /* ----- App (hidden until file loaded) ----- */
      #app {
        display: none;
        flex-direction: column;
        height: 100vh;
      }
      #app.visible {
        display: flex;
      }
      #app.loading {
        cursor: progress;
      }

      /* ----- Toolbar ----- */
      #toolbar {
        position: sticky;
        top: 0;
        z-index: 100;
        background: var(--bg-toolbar);
        border-bottom: 1px solid var(--border-color);
        padding: 0 20px;
        height: var(--toolbar-height);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-3);
        flex-shrink: 0;
        transition:
          background var(--transition),
          border-color var(--transition);
      }

      .toolbar-left {
        display: flex;
        align-items: center;
        gap: var(--space-3);
        min-width: 0;
        flex: 1;
      }
      .toolbar-left .file-icon {
        font-size: 18px;
        flex-shrink: 0;
      }
      .toolbar-left .file-name {
        font-weight: 600;
        font-size: 14px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        color: var(--text-heading);
        max-width: 320px;
      }
      .toolbar-left .file-stats {
        font-size: 12px;
        color: var(--text-secondary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .toolbar-left .file-stats span {
        margin: 0 4px;
      }
      .toolbar-left .file-stats .sep {
        color: var(--text-muted);
      }

      .toolbar-right {
        display: flex;
        align-items: center;
        gap: var(--space-1);
        flex-shrink: 0;
      }

      .toolbar-right .btn-icon {
        width: 36px;
        height: 36px;
      }

      /* ----- Reading Progress ----- */
      #progress-bar {
        position: fixed;
        top: var(--toolbar-height);
        left: 0;
        height: 3px;
        background: var(--border-focus);
        width: 0%;
        z-index: 99;
        transition: width 0.1s ease;
        border-radius: 0 2px 2px 0;
        box-shadow: 0 0 8px rgba(37, 99, 235, 0.3);
      }

      /* ----- Main Layout ----- */
      #main {
        display: flex;
        flex: 1;
        min-height: 0;
        position: relative;
      }

      /* ----- TOC ----- */
      #toc {
        width: var(--toc-width);
        background: var(--bg-toc);
        border-right: 1px solid var(--border-color);
        padding: 20px 16px;
        overflow-y: auto;
        flex-shrink: 0;
        height: calc(100vh - var(--toolbar-height));
        position: sticky;
        top: var(--toolbar-height);
        transition:
          background var(--transition),
          border-color var(--transition),
          transform 0.3s ease;
      }
      #toc .toc-title {
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.6px;
        color: var(--text-muted);
        margin-bottom: 14px;
        padding-bottom: var(--space-2);
        border-bottom: 1px solid var(--border-color);
      }
      #toc .toc-list {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      #toc .toc-list ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      #toc .toc-list li {
        margin: 0;
        padding: 0;
      }
      #toc .toc-list a {
        display: block;
        padding: var(--space-1) var(--space-2);
        font-size: 13px;
        color: var(--text-secondary);
        text-decoration: none;
        border-radius: 4px;
        transition:
          background var(--transition),
          color var(--transition);
        border-left: 2px solid transparent;
        line-height: 1.4;
      }
      #toc .toc-list a:hover {
        background: var(--bg-upload-hover);
        color: var(--text-primary);
      }
      #toc .toc-list a.active {
        color: var(--text-link);
        border-left-color: var(--text-link);
        background: var(--bg-upload-hover);
      }
      #toc .toc-list .level-2 {
        padding-left: 20px;
        font-size: 12.5px;
      }
      #toc .toc-list .level-3 {
        padding-left: 36px;
        font-size: 12px;
      }
      #toc .toc-list .level-4 {
        padding-left: 52px;
        font-size: 11.5px;
      }
      #toc .toc-list .level-5,
      #toc .toc-list .level-6 {
        padding-left: 68px;
        font-size: 11px;
      }
      #toc .toc-empty {
        padding: var(--space-2);
        font-size: 13px;
        color: var(--text-muted);
      }

      /* TOC toggle for mobile */
      #toc-toggle {
        display: none;
        position: fixed;
        bottom: 20px;
        left: 20px;
        z-index: 90;
        background: var(--bg-content);
        border: 1px solid var(--border-color);
        border-radius: 50%;
        width: 48px;
        height: 48px;
        font-size: 20px;
        cursor: pointer;
        box-shadow: var(--shadow-md);
        transition:
          background var(--transition),
          transform var(--transition);
        color: var(--text-primary);
        align-items: center;
        justify-content: center;
      }
      #toc-toggle:hover {
        transform: scale(1.05);
      }
      #toc-toggle.active {
        background: var(--border-focus);
        color: #fff;
        border-color: var(--border-focus);
      }
      #toc-toggle svg {
        display: block;
      }

      /* ----- Content (document scroll container) ----- */
      #content {
        flex: 1;
        padding: 40px 32px 80px;
        overflow-y: auto;
        overscroll-behavior: contain;
        background: var(--bg-content);
        transition: background var(--transition);
        min-width: 0;
        max-width: calc(100% - var(--toc-width));
      }
      #content .content-inner {
        max-width: var(--max-width);
        margin: 0 auto;
      }

      /* ----- Document Typography ----- */
      #content h1,
      #content h2,
      #content h3,
      #content h4,
      #content h5,
      #content h6 {
        color: var(--text-heading);
        margin-top: 1.8em;
        margin-bottom: 0.5em;
        font-weight: 700;
        line-height: 1.3;
        scroll-margin-top: calc(var(--toolbar-height) + 16px);
        transition: color var(--transition);
      }
      #content h1 {
        font-size: 2.2em;
        margin-top: 0;
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 0.3em;
      }
      #content h2 {
        font-size: 1.7em;
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 0.25em;
      }
      #content h3 {
        font-size: 1.35em;
      }
      #content h4 {
        font-size: 1.15em;
      }
      #content h5 {
        font-size: 1em;
      }
      #content h6 {
        font-size: 0.9em;
        color: var(--text-secondary);
      }

      #content p {
        margin: 0 0 1.2em 0;
        line-height: 1.7;
        color: var(--text-primary);
      }

      #content a {
        color: var(--text-link);
        text-decoration: none;
        border-bottom: 1px solid transparent;
        transition:
          color var(--transition),
          border-color var(--transition);
      }
      #content a:hover {
        color: var(--text-link-hover);
        border-bottom-color: var(--text-link-hover);
      }

      #content strong {
        font-weight: 700;
        color: var(--text-heading);
      }
      #content em {
        font-style: italic;
      }
      #content del {
        text-decoration: line-through;
        color: var(--text-secondary);
      }

      /* Inline code */
      #content code:not(pre code) {
        font-family: var(--font-mono);
        font-size: 0.9em;
        padding: 0.2em 0.5em;
        background: var(--bg-code);
        border-radius: 4px;
        color: var(--text-code);
        border: 1px solid var(--border-color);
        white-space: nowrap;
        transition:
          background var(--transition),
          color var(--transition),
          border-color var(--transition);
      }

      /* Code blocks */
      #content pre {
        margin: 1.2em 0;
        border-radius: var(--radius);
        background: var(--bg-code-block);
        border: 1px solid var(--border-color);
        overflow: hidden;
        transition:
          background var(--transition),
          border-color var(--transition);
      }
      #content pre code {
        display: block;
        padding: 16px 20px;
        font-family: var(--font-mono);
        font-size: 13.5px;
        line-height: 1.65;
        overflow-x: auto;
        white-space: pre;
        color: var(--text-code-block);
        tab-size: 2;
      }

      /* Code block header (language + copy) */
      .code-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: var(--space-2) var(--space-4);
        background: var(--bg-code-header);
        border-bottom: 1px solid var(--border-color);
        font-size: 12px;
        font-weight: 600;
        color: var(--text-secondary);
        transition:
          background var(--transition),
          border-color var(--transition);
        font-family: var(--font-sans);
      }
      .code-header .lang {
        text-transform: uppercase;
        letter-spacing: 0.3px;
        font-size: 11px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .code-header .copy-btn {
        background: transparent;
        border: none;
        cursor: pointer;
        font-size: 12px;
        color: var(--text-secondary);
        padding: 4px 10px;
        border-radius: 4px;
        transition:
          background var(--transition),
          color var(--transition);
        font-family: var(--font-sans);
        min-height: 28px;
      }
      .code-header .copy-btn:hover {
        background: var(--bg-upload-hover);
        color: var(--text-primary);
      }
      .code-header .copy-btn.copied {
        color: var(--text-success);
      }

      /* ----- Lists ----- */
      #content ul,
      #content ol {
        margin: 0 0 1.2em 0;
        padding-left: 1.8em;
        line-height: 1.7;
      }
      #content ul ul,
      #content ol ol,
      #content ul ol,
      #content ol ul {
        margin-bottom: 0.4em;
      }
      #content li {
        margin-bottom: 0.2em;
      }
      #content li > p {
        margin-bottom: 0.2em;
      }

      /* Checkboxes */
      #content .task-list-item {
        list-style: none;
        display: flex;
        align-items: flex-start;
        gap: var(--space-2);
        padding-left: 0;
      }
      #content .task-list-item input[type="checkbox"] {
        margin-top: 4px;
        width: 16px;
        height: 16px;
        accent-color: var(--border-focus);
        cursor: default;
        flex-shrink: 0;
      }
      #content ul .task-list-item {
        margin-left: -1.8em;
      }

      /* ----- Blockquotes ----- */
      #content blockquote {
        margin: 1.2em 0;
        padding: 12px 20px;
        background: var(--bg-blockquote);
        border-left: 4px solid var(--text-link);
        border-radius: 0 var(--radius) var(--radius) 0;
        color: var(--text-secondary);
        transition:
          background var(--transition),
          border-color var(--transition);
      }
      #content blockquote p:last-child {
        margin-bottom: 0;
      }
      #content blockquote code:not(pre code) {
        background: var(--bg-code);
      }

      /* ----- Horizontal Rules ----- */
      #content hr {
        border: none;
        height: 1px;
        background: var(--border-color);
        margin: 2.4em 0;
        transition: background var(--transition);
      }

      /* ----- Images ----- */
      #content img {
        max-width: 100%;
        height: auto;
        border-radius: var(--radius);
        border: 1px solid var(--border-color);
        margin: 0.8em 0;
      }
      #content img.broken {
        border-style: dashed;
        opacity: 0.7;
        min-height: 48px;
        padding: var(--space-4);
      }

      /* ----- Tables ----- */
      #content .table-wrapper {
        overflow-x: auto;
        margin: 1.2em 0;
        border-radius: var(--radius);
        border: 1px solid var(--border-color);
        transition: border-color var(--transition);
      }
      #content table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
        min-width: 480px;
      }
      #content table th {
        background: var(--bg-upload);
        font-weight: 700;
        color: var(--text-heading);
        padding: 10px 14px;
        text-align: left;
        border-bottom: 2px solid var(--border-color);
        transition:
          background var(--transition),
          border-color var(--transition);
      }
      #content table td {
        padding: 9px 14px;
        border-bottom: 1px solid var(--border-color);
        transition: border-color var(--transition);
      }
      #content table tr:last-child td {
        border-bottom: none;
      }
      #content table tbody tr:nth-child(even) {
        background: var(--bg-table-stripe);
      }
      #content table tbody tr:hover {
        background: var(--bg-upload-hover);
      }

      /* ----- Back to Top ----- */
      #back-to-top {
        position: fixed;
        bottom: 24px;
        right: 24px;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: var(--bg-content);
        border: 1px solid var(--border-color);
        box-shadow: var(--shadow-md);
        cursor: pointer;
        font-size: 20px;
        color: var(--text-secondary);
        transition:
          opacity var(--transition),
          transform var(--transition),
          background var(--transition);
        opacity: 0;
        transform: translateY(12px);
        pointer-events: none;
        z-index: 80;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #back-to-top.visible {
        opacity: 1;
        transform: translateY(0);
        pointer-events: auto;
      }
      #back-to-top:hover {
        background: var(--bg-upload-hover);
        color: var(--text-primary);
        transform: translateY(-2px);
      }
      #back-to-top svg {
        display: block;
      }

      /* ----- Error toast ----- */
      .toast {
        position: fixed;
        bottom: 80px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--bg-content);
        color: var(--text-primary);
        padding: 12px 24px;
        border-radius: var(--radius);
        border: 1px solid var(--border-color);
        box-shadow: var(--shadow-lg);
        font-size: 14px;
        z-index: 200;
        max-width: 90%;
        opacity: 0;
        transition:
          opacity 0.3s ease,
          transform 0.3s ease;
        pointer-events: none;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
        pointer-events: auto;
      }
      .toast.error {
        border-left: 4px solid var(--text-danger);
      }
      .toast.success {
        border-left: 4px solid var(--text-success);
      }
      .toast .toast-icon {
        font-size: 18px;
        flex-shrink: 0;
      }

      /* ----- TOC overlay for mobile ----- */
      #toc-overlay {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 45;
        background: rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(2px);
      }
      #toc-overlay.visible {
        display: block;
      }

      /* Lock document scroll while the mobile drawer is open */
      #app.toc-open #content {
        overflow: hidden;
      }

      /* ----- Responsive ----- */
      @media (max-width: 1024px) {
        #toc {
          width: 220px;
        }
        #content {
          max-width: calc(100% - 220px);
        }
      }

      @media (max-width: 820px) {
        #toc {
          position: fixed;
          top: var(--toolbar-height);
          left: 0;
          bottom: 0;
          width: 280px;
          transform: translateX(-100%);
          z-index: 50;
          height: calc(100vh - var(--toolbar-height));
          box-shadow: var(--shadow-lg);
          border-right: 1px solid var(--border-color);
          background: var(--bg-content);
          transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #toc.open {
          transform: translateX(0);
        }
        #toc-toggle {
          display: flex;
        }
        #content {
          max-width: 100%;
          padding: 24px 20px 80px;
        }
        .toolbar-left .file-stats {
          display: none;
        }
        @media (min-width: 821px) {
          #toc-overlay {
            display: none !important;
          }
        }
      }

      @media (max-width: 600px) {
        #toolbar {
          padding: 0 10px;
          gap: var(--space-2);
        }
        .toolbar-left {
          gap: var(--space-2);
        }
        .toolbar-left .file-name {
          font-size: 13px;
          max-width: 130px;
        }
        .toolbar-right {
          gap: 2px;
        }
        .toolbar-right .btn-icon {
          width: 40px;
          height: 40px;
        }
        #content {
          padding: 16px 16px 80px;
        }
        #content h1 {
          font-size: 1.7em;
        }
        #content h2 {
          font-size: 1.4em;
        }
        #content h3 {
          font-size: 1.2em;
        }
        #content pre code {
          font-size: 12px;
          padding: 12px 14px;
        }
        .empty-container {
          padding: var(--space-6) 20px;
        }
        .empty-title {
          font-size: 18px;
        }
        #toc {
          width: 260px;
        }
        #back-to-top {
          width: 44px;
          height: 44px;
          bottom: 16px;
          right: 16px;
        }
        #toc-toggle {
          width: 44px;
          height: 44px;
          bottom: 16px;
          left: 16px;
        }
        .toast {
          bottom: 78px;
          max-width: calc(100% - 150px);
          font-size: 13px;
          padding: 10px 14px;
        }
      }

      @media (max-width: 420px) {
        .toolbar-left .file-icon {
          display: none;
        }
        .toolbar-left .file-name {
          max-width: 88px;
        }
        #content {
          padding: 12px 12px 70px;
        }
        #content table {
          font-size: 12px;
          min-width: 320px;
        }
        #content table th,
        #content table td {
          padding: 6px 10px;
        }
        #toc {
          width: 240px;
        }
        #back-to-top {
          width: 40px;
          height: 40px;
        }
        #toc-toggle {
          width: 40px;
          height: 40px;
        }
      }

      /* ----- Print Styles ----- */
      @media print {
        #toolbar,
        #toc,
        #toc-toggle,
        #toc-overlay,
        #back-to-top,
        #progress-bar,
        .code-header .copy-btn,
        .no-print {
          display: none !important;
        }
        #app {
          display: block !important;
          height: auto !important;
        }
        #app.toc-open #content {
          overflow: visible !important;
        }
        #content {
          padding: 20px 40px !important;
          max-width: 100% !important;
          overflow: visible !important;
          max-height: none !important;
          background: #fff !important;
          color: #000 !important;
        }
        #content h1,
        #content h2,
        #content h3,
        #content h4,
        #content h5,
        #content h6 {
          color: #000 !important;
        }
        #content a {
          color: #000 !important;
          border-bottom: 1px solid #000 !important;
        }
        #content pre {
          background: #f5f5f5 !important;
          border: 1px solid #ddd !important;
          break-inside: avoid;
        }
        #content code:not(pre code) {
          background: #f5f5f5 !important;
          border: 1px solid #ddd !important;
          color: #d63384 !important;
        }
        #content table th {
          background: #f0f0f0 !important;
        }
        #content table td {
          border-bottom: 1px solid #ddd !important;
        }
        #content blockquote {
          background: #f8f8f8 !important;
          border-left-color: #333 !important;
          break-inside: avoid;
        }
        #content .table-wrapper {
          border: 1px solid #ddd !important;
          break-inside: avoid;
        }
        #content img {
          border: 1px solid #ddd !important;
          break-inside: avoid;
        }
        #content tr {
          break-inside: avoid;
        }
        body {
          background: #fff !important;
        }
        #content .task-list-item input[type="checkbox"] {
          accent-color: #000 !important;
        }
        .code-header {
          background: #f0f0f0 !important;
          border-bottom: 1px solid #ddd !important;
        }
        .code-header .lang {
          color: #555 !important;
        }
        #main {
          display: block !important;
        }
        #empty-state {
          display: none !important;
        }
        #app.visible {
          display: block !important;
        }
      }

      /* ----- Utility ----- */
      .hidden {
        display: none !important;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        border: 0;
      }
    </style>
  </head>
  <body>
    <!-- ===== EMPTY STATE ===== -->
    <div id="empty-state">
      <div class="empty-container" id="drop-zone">
        <span class="empty-icon">📄</span>
        <div class="empty-title">Markdown → Beautiful HTML</div>
        <div class="empty-sub">Drop your Markdown file here</div>
        <div class="empty-actions">
          <button class="btn btn-primary" id="choose-file-btn">
            📁 Choose Markdown File
          </button>
          <button class="btn btn-secondary" id="example-btn">
            ✨ Try Example
          </button>
        </div>
        <div class="drop-hint" id="drop-hint"></div>
        <div class="empty-hint">
          Supports .md and .markdown files · Downloaded HTML needs internet for
          code highlighting
        </div>
        <input type="file" id="file-input" accept=".md,.markdown" />
      </div>
    </div>

    <!-- ===== TOAST ===== -->
    <div class="toast" id="toast">
      <span class="toast-icon">📌</span>
      <span id="toast-message">Message</span>
    </div>

    <!-- ===== APP ===== -->
    <div id="app">
      <!-- Toolbar -->
      <header id="toolbar">
        <div class="toolbar-left">
          <span class="file-icon">📄</span>
          <span class="file-name" id="file-name-display">document.md</span>
          <span class="file-stats" id="file-stats-display">
            <span id="stat-words">0</span> words
            <span class="sep">·</span>
            <span id="stat-headings">0</span> headings
            <span class="sep">·</span>
            <span id="stat-codeblocks">0</span> code blocks
            <span class="sep">·</span>
            <span id="stat-reading">0 min</span>
          </span>
        </div>
        <div class="toolbar-right">
          <button
            class="btn-icon"
            id="theme-toggle"
            aria-label="Switch theme"
            title="Toggle theme (Ctrl+Shift+D)"
          ></button>
          <button
            class="btn-icon"
            id="fullscreen-btn"
            aria-label="Enter fullscreen"
            title="Enter fullscreen"
          ></button>
          <button
            class="btn-icon"
            id="download-btn"
            aria-label="Download HTML"
            title="Download HTML"
          >
            <svg
              viewBox="0 0 24 24"
              width="18"
              height="18"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <polyline points="7 10 12 15 17 10" />
              <line x1="12" y1="15" x2="12" y2="3" />
            </svg>
          </button>
          <button
            class="btn-icon"
            id="reupload-btn"
            aria-label="Upload another file"
            title="Upload another file"
          >
            <svg
              viewBox="0 0 24 24"
              width="18"
              height="18"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path
                d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"
              />
            </svg>
          </button>
          <input type="file" id="file-input-toolbar" accept=".md,.markdown" />
        </div>
      </header>

      <!-- Progress Bar -->
      <div id="progress-bar"></div>

      <!-- Main -->
      <div id="main">
        <!-- TOC Overlay (mobile) -->
        <div id="toc-overlay"></div>

        <!-- TOC Sidebar -->
        <nav id="toc" aria-label="Table of Contents">
          <div class="toc-title">Contents</div>
          <ul class="toc-list" id="toc-list">
            <!-- filled by JS -->
          </ul>
        </nav>

        <!-- Content -->
        <main id="content">
          <div class="content-inner" id="markdown-content">
            <!-- rendered markdown goes here -->
          </div>
        </main>
      </div>

      <!-- Back to Top -->
      <button id="back-to-top" aria-label="Back to top">
        <svg
          viewBox="0 0 24 24"
          width="20"
          height="20"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <polyline points="18 15 12 9 6 15" />
        </svg>
      </button>

      <!-- TOC Toggle (mobile) -->
      <button
        id="toc-toggle"
        aria-label="Toggle table of contents"
        aria-expanded="false"
      ></button>
    </div>

    <!-- ===== JAVASCRIPT ===== -->
    <script>
      (function () {
        "use strict";

        // ─── CONFIG ────────────────────────────────────────────────────────────
        const CONFIG = {
          maxFileSize: 10 * 1024 * 1024, // 10MB
          largeFileSize: 1024 * 1024, // show loading toast above this
        };

        const HLJS_LIGHT =
          "https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css";
        const HLJS_DARK =
          "https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css";
        const HLJS_SCRIPT =
          "https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js";

        // ─── STATE ─────────────────────────────────────────────────────────────
        const state = {
          currentFile: null,
          theme: "light",
          tocItems: [],
          tocObserver: null,
          stats: {
            words: 0,
            headings: 0,
            codeBlocks: 0,
          },
        };

        let loadRequestId = 0;
        let toastTimer = null;

        // ─── DOM REFS ──────────────────────────────────────────────────────────
        const DOM = {
          emptyState: $("#empty-state"),
          dropZone: $("#drop-zone"),
          dropHint: $("#drop-hint"),
          fileInput: $("#file-input"),
          fileInputToolbar: $("#file-input-toolbar"),
          chooseBtn: $("#choose-file-btn"),
          exampleBtn: $("#example-btn"),

          app: $("#app"),
          fileName: $("#file-name-display"),
          statWords: $("#stat-words"),
          statHeadings: $("#stat-headings"),
          statCodeblocks: $("#stat-codeblocks"),
          statReading: $("#stat-reading"),

          content: $("#content"),
          markdownContent: $("#markdown-content"),
          tocList: $("#toc-list"),
          tocNav: $("#toc"),
          tocToggle: $("#toc-toggle"),
          tocOverlay: $("#toc-overlay"),
          backToTop: $("#back-to-top"),
          progressBar: $("#progress-bar"),

          themeToggle: $("#theme-toggle"),
          fullscreenBtn: $("#fullscreen-btn"),
          downloadBtn: $("#download-btn"),
          reuploadBtn: $("#reupload-btn"),

          toast: $("#toast"),
          toastMessage: $("#toast-message"),
        };

        function $(sel) {
          return document.querySelector(sel);
        }

        // ─── ICONS (inline SVG, safe static markup) ────────────────────────────
        function svg(inner, size) {
          const s = size || 18;
          return (
            '<svg viewBox="0 0 24 24" width="' +
            s +
            '" height="' +
            s +
            '" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" ' +
            'stroke-linejoin="round" aria-hidden="true">' +
            inner +
            "</svg>"
          );
        }

        const ICONS = {
          sun: svg(
            '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>',
          ),
          moon: svg(
            '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>',
          ),
          fullscreenEnter: svg(
            '<path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M16 21h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>',
          ),
          fullscreenExit: svg(
            '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
          ),
          menu: svg(
            '<line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/>',
          ),
          menuClose: svg(
            '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
            20,
          ),
        };

        // ─── THEME ─────────────────────────────────────────────────────────────
        function getSystemTheme() {
          return window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }

        function loadTheme() {
          const saved = localStorage.getItem("md-formatter-theme");
          state.theme =
            saved === "dark" || saved === "light" ? saved : getSystemTheme();
          applyTheme(state.theme);
        }

        function applyTheme(theme) {
          state.theme = theme;
          document.documentElement.setAttribute("data-theme", theme);
          localStorage.setItem("md-formatter-theme", theme);

          DOM.themeToggle.innerHTML = theme === "dark" ? ICONS.sun : ICONS.moon;
          DOM.themeToggle.setAttribute(
            "aria-label",
            theme === "dark" ? "Switch to light theme" : "Switch to dark theme",
          );
          DOM.themeToggle.title =
            theme === "dark"
              ? "Switch to light theme (Ctrl+Shift+D)"
              : "Switch to dark theme (Ctrl+Shift+D)";

          const hljsLink = document.getElementById("hljs-theme");
          if (hljsLink) {
            hljsLink.href = theme === "dark" ? HLJS_DARK : HLJS_LIGHT;
          }
        }

        function toggleTheme() {
          applyTheme(state.theme === "light" ? "dark" : "light");
        }

        // ─── TOAST ─────────────────────────────────────────────────────────────
        function showToast(message, type) {
          const el = DOM.toast;
          const icon = el.querySelector(".toast-icon");
          DOM.toastMessage.textContent = message;
          el.className = "toast " + (type || "info");
          if (type === "error") icon.textContent = "❌";
          else if (type === "success") icon.textContent = "✅";
          else icon.textContent = "📌";
          el.classList.add("show");
          clearTimeout(toastTimer);
          toastTimer = setTimeout(() => el.classList.remove("show"), 4000);
        }

        // ─── FILE HANDLING ────────────────────────────────────────────────────
        function isMarkdownFile(file) {
          const ext = file.name.split(".").pop().toLowerCase();
          return ["md", "markdown"].includes(ext);
        }

        function validateFile(file) {
          if (!file) return { valid: false, error: "No file selected." };
          if (!isMarkdownFile(file)) {
            return {
              valid: false,
              error: "Please upload a .md or .markdown file.",
            };
          }
          if (file.size === 0) {
            return { valid: false, error: "The file is empty." };
          }
          if (file.size > CONFIG.maxFileSize) {
            return {
              valid: false,
              error:
                "File exceeds " +
                CONFIG.maxFileSize / 1024 / 1024 +
                "MB limit.",
            };
          }
          return { valid: true };
        }

        function readFileAsText(file) {
          return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = () => reject(new Error("Failed to read file."));
            reader.readAsText(file, "UTF-8");
          });
        }

        // ─── SECURITY / TEXT HELPERS ──────────────────────────────────────────
        function escapeHtml(value) {
          return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
        }

        function sanitizeFilename(name) {
          return (
            String(name)
              .replace(/[\\/:*?"<>|]/g, "-")
              .replace(/\s+/g, " ")
              .replace(/[.\s]+$/, "")
              .trim() || "document"
          );
        }

        function dedent(str) {
          return String(str)
            .replace(/^ {4}/gm, "")
            .trim();
        }

        // ─── MARKDOWN PROCESSING ──────────────────────────────────────────────
        function parseMarkdown(text) {
          try {
            marked.setOptions({
              gfm: true,
              breaks: true,
              pedantic: false,
            });
            const rawHtml = marked.parse(text);
            // Pipeline: Markdown → Marked → HTML → DOMPurify → DOM → Highlight.js
            return DOMPurify.sanitize(rawHtml, {
              USE_PROFILES: { html: true },
              ADD_ATTR: ["target"],
              ADD_TAGS: ["input"],
            });
          } catch (err) {
            console.error("Parse error:", err);
            throw new Error("Failed to parse Markdown: " + err.message);
          }
        }

        // ─── STATISTICS ────────────────────────────────────────────────────────
        function calculateStats() {
          // Word count is derived from the rendered document text so Markdown
          // syntax tokens are not counted. Code content contributes because it
          // is part of the rendered text.
          const text = DOM.markdownContent.textContent
            .replace(/\s+/g, " ")
            .trim();
          const words = text ? text.split(" ").length : 0;
          const headings = DOM.markdownContent.querySelectorAll(
            "h1, h2, h3, h4, h5, h6",
          ).length;
          const codeBlocks =
            DOM.markdownContent.querySelectorAll("pre code").length;
          return { words, headings, codeBlocks };
        }

        function formatReadingTime(words) {
          if (words === 0) return "0 min";
          if (words < 200) return "<1 min";
          return Math.ceil(words / 200) + " min";
        }

        function updateStats(stats) {
          DOM.statWords.textContent = stats.words;
          DOM.statHeadings.textContent = stats.headings;
          DOM.statCodeblocks.textContent = stats.codeBlocks;
          DOM.statReading.textContent = formatReadingTime(stats.words);
          state.stats = stats;
        }

        // ─── SCROLL CONTAINER ─────────────────────────────────────────────────
        function getScrollContainer() {
          return DOM.content;
        }

        function updateProgress() {
          const scroller = getScrollContainer();
          const maxScroll = scroller.scrollHeight - scroller.clientHeight;
          const progress =
            maxScroll > 0
              ? Math.min(
                  100,
                  Math.max(0, (scroller.scrollTop / maxScroll) * 100),
                )
              : 0;
          DOM.progressBar.style.width = progress + "%";
        }

        // ─── RENDER ────────────────────────────────────────────────────────────
        function renderDocument(html) {
          DOM.markdownContent.replaceChildren();
          DOM.markdownContent.innerHTML = html;

          // External links open in a new tab with rel protection
          DOM.markdownContent
            .querySelectorAll('a[href^="http"]')
            .forEach((a) => {
              a.target = "_blank";
              a.rel = "noopener noreferrer";
            });

          // Graceful broken-image handling
          DOM.markdownContent.querySelectorAll("img").forEach((img) => {
            const mark = () => img.classList.add("broken");
            img.addEventListener("error", mark);
            if (img.complete && img.naturalWidth === 0) mark();
          });

          // Highlight + wrap code blocks
          DOM.markdownContent.querySelectorAll("pre code").forEach((block) => {
            try {
              hljs.highlightElement(block);
            } catch (e) {
              block.classList.add("hljs");
            }
            wrapCodeBlock(block);
          });

          // Wrap tables so they scroll horizontally without overflowing the page
          DOM.markdownContent.querySelectorAll("table").forEach((table) => {
            if (!table.parentElement.classList.contains("table-wrapper")) {
              const wrapper = document.createElement("div");
              wrapper.className = "table-wrapper";
              table.parentElement.replaceChild(wrapper, table);
              wrapper.appendChild(table);
            }
          });

          // Task-list styling
          DOM.markdownContent
            .querySelectorAll('input[type="checkbox"]')
            .forEach((cb) => {
              const li = cb.closest("li");
              if (li) li.classList.add("task-list-item");
            });

          generateTOC();
          setupCopyButtons();
        }

        // ─── CODE BLOCKS ───────────────────────────────────────────────────────
        const LANGUAGE_LABELS = {
          javascript: "JavaScript",
          js: "JavaScript",
          typescript: "TypeScript",
          ts: "TypeScript",
          html: "HTML",
          css: "CSS",
          bash: "Bash",
          shell: "Shell",
          sh: "Shell",
          python: "Python",
          py: "Python",
          json: "JSON",
          markdown: "Markdown",
          md: "Markdown",
        };

        function formatLanguage(lang) {
          return LANGUAGE_LABELS[lang.toLowerCase()] || lang;
        }

        function wrapCodeBlock(block) {
          const pre = block.parentElement;
          if (!pre) return;

          let lang = "";
          Array.prototype.forEach.call(block.classList, (cls) => {
            if (cls.indexOf("language-") === 0) {
              lang = cls.slice("language-".length);
            }
          });

          if (!pre.id) {
            pre.id =
              "code-" +
              Date.now().toString(36) +
              "-" +
              Math.random().toString(36).slice(2, 6);
          }

          const header = document.createElement("div");
          header.className = "code-header";

          const langEl = document.createElement("span");
          langEl.className = "lang";
          langEl.textContent = lang ? formatLanguage(lang) : "Plain text";

          const copyBtn = document.createElement("button");
          copyBtn.className = "copy-btn";
          copyBtn.textContent = "Copy";
          copyBtn.setAttribute("aria-label", "Copy code");
          copyBtn.dataset.copyTarget = pre.id;

          header.append(langEl, copyBtn);
          pre.parentElement.insertBefore(header, pre);
        }

        // ─── COPY BUTTONS ──────────────────────────────────────────────────────
        function setupCopyButtons() {
          DOM.markdownContent.querySelectorAll(".copy-btn").forEach((btn) => {
            btn.addEventListener("click", handleCopyClick);
          });
        }

        function fallbackCopy(text) {
          try {
            const ta = document.createElement("textarea");
            ta.value = text;
            ta.setAttribute("readonly", "");
            ta.style.position = "fixed";
            ta.style.top = "0";
            ta.style.opacity = "0";
            document.body.appendChild(ta);
            ta.select();
            const ok = document.execCommand("copy");
            document.body.removeChild(ta);
            return ok;
          } catch (e) {
            return false;
          }
        }

        async function copyText(text) {
          try {
            await navigator.clipboard.writeText(text);
            return true;
          } catch (e) {
            return fallbackCopy(text);
          }
        }

        async function handleCopyClick(e) {
          const btn = e.currentTarget;
          const pre = document.getElementById(btn.dataset.copyTarget);
          const code = pre && pre.querySelector("code");
          const text = code ? code.textContent : pre ? pre.textContent : "";
          const trimmed = text.trim();

          if (!trimmed) {
            showToast("Nothing to copy.", "error");
            return;
          }

          const ok = await copyText(trimmed);
          if (ok) {
            const original = btn.textContent;
            btn.textContent = "Copied ✓";
            btn.classList.add("copied");
            setTimeout(() => {
              btn.textContent = original;
              btn.classList.remove("copied");
            }, 2000);
          } else {
            showToast("Copy failed", "error");
          }
        }

        // ─── TABLE OF CONTENTS ─────────────────────────────────────────────────
        function createUniqueSlug(text, usedIds) {
          const base =
            text
              .toLowerCase()
              .trim()
              .replace(/[^\w\s-]/g, "")
              .replace(/\s+/g, "-")
              .replace(/-+/g, "-")
              .replace(/^-|-$/g, "") || "section";

          let slug = base;
          let counter = 2;
          while (usedIds.has(slug)) {
            slug = base + "-" + counter++;
          }
          usedIds.add(slug);
          return slug;
        }

        function generateTOC() {
          const headings = DOM.markdownContent.querySelectorAll(
            "h1, h2, h3, h4, h5, h6",
          );
          const tocList = DOM.tocList;
          tocList.replaceChildren();

          state.tocItems = [];

          if (headings.length === 0) {
            const empty = document.createElement("li");
            empty.className = "toc-empty";
            empty.textContent = "No headings found";
            tocList.appendChild(empty);
            disposeTocObserver();
            return;
          }

          const usedIds = new Set();
          const items = [];

          headings.forEach((h) => {
            const level = parseInt(h.tagName.charAt(1), 10);
            if (h.id) {
              h.id = (() => {
                const id = h.id;
                if (usedIds.has(id))
                  return createUniqueSlug(h.textContent, usedIds);
                usedIds.add(id);
                return id;
              })();
            } else {
              h.id = createUniqueSlug(h.textContent, usedIds);
            }
            items.push({
              id: h.id,
              text: h.textContent.trim(),
              level,
              element: h,
            });
          });

          state.tocItems = items;

          const root = tocList;
          const stack = [{ li: null, level: 0 }];

          items.forEach((item) => {
            while (
              stack.length > 1 &&
              stack[stack.length - 1].level >= item.level
            ) {
              stack.pop();
            }

            const parent = stack[stack.length - 1];
            let container;
            if (parent.li === null) {
              container = root;
            } else {
              let childUl = parent.li.querySelector(":scope > ul");
              if (!childUl) {
                childUl = document.createElement("ul");
                parent.li.appendChild(childUl);
              }
              container = childUl;
            }

            const li = document.createElement("li");
            const a = document.createElement("a");
            a.href = "#" + item.id;
            a.textContent = item.text;
            a.className = "level-" + item.level;
            a.dataset.target = item.id;
            a.addEventListener("click", (e) => {
              e.preventDefault();
              const target = document.getElementById(item.id);
              if (target) {
                closeTOCMobile();
                target.scrollIntoView({ behavior: "smooth", block: "start" });
                updateActiveTOC(item.id);
              }
            });

            li.appendChild(a);
            container.appendChild(li);
            stack.push({ li, level: item.level });
          });

          setupTOCScrollSpy();
        }

        function disposeTocObserver() {
          if (state.tocObserver) {
            state.tocObserver.disconnect();
            state.tocObserver = null;
          }
        }

        function setupTOCScrollSpy() {
          disposeTocObserver();
          const items = state.tocItems;
          if (items.length === 0) return;

          const observer = new IntersectionObserver(
            (entries) => {
              const visible = entries.filter((e) => e.isIntersecting);
              if (visible.length === 0) return;
              const top = visible.reduce((a, b) =>
                a.boundingClientRect.top <= b.boundingClientRect.top ? a : b,
              );
              updateActiveTOC(top.target.id);
            },
            {
              root: getScrollContainer(),
              rootMargin: "-20px 0px -70% 0px",
              threshold: 0,
            },
          );

          items.forEach((item) => observer.observe(item.element));
          state.tocObserver = observer;
        }

        function updateActiveTOC(id) {
          DOM.tocList.querySelectorAll("a").forEach((a) => {
            a.classList.toggle("active", a.dataset.target === id);
          });
        }

        function closeTOCMobile() {

          DOM.tocToggle.setAttribute("aria-expanded", "false");

        function toggleTOCMobile() {

          const validation = validateFile(file);

            showToast(validation.error, "error");
            return;
          }

          if (file.size > CONFIG.largeFileSize) {
            showToast("Parsing Markdown…", "info");
          }
          setLoading(true);

          try {
            const content = await readFileAsText(file);

            if (requestId !== loadRequestId) return;

            if (!content.trim()) {
              setLoading(false);
              showToast(
                "The file is empty or contains only whitespace.",
                "error",
              );
              return;
            }

            resetDocState();

            state.currentFile = file;
            const html = parseMarkdown(content);

            DOM.fileName.textContent = file.name;
            DOM.emptyState.classList.add("hidden");
            DOM.app.classList.add("visible");

            renderDocument(html);
            updateStats(calculateStats());

            getScrollContainer().scrollTop = 0;

            showToast('Loaded "' + file.name + '"', "success");
          } catch (err) {
            console.error(err);
            if (requestId === loadRequestId) {
              showToast("Error loading file: " + err.message, "error");
            }
          } finally {
            if (requestId === loadRequestId) setLoading(false);

        // ─── LOAD EXAMPLE ──────────────────────────────────────────────────────
        function loadExample() {
          const file = new File([dedent(SAMPLE_MARKDOWN)], "git-commands.md", {
            type: "text/markdown",
          });
          loadFile(file);
        }

        // ─── SETUP UPLOAD ─────────────────────────────────────────────────────
        function clearDropFeedback() {
          DOM.dropZone.classList.remove("dragover", "invalid");
          DOM.dropHint.classList.add("hidden");
        }

        function updateDropFeedback(e) {
          const files = e.dataTransfer.files;
          const bad =
            files.length > 0 &&
            Array.prototype.some.call(files, (f) => !isMarkdownFile(f));
          DOM.dropZone.classList.toggle("invalid", bad);
          DOM.dropHint.textContent = bad
            ? "Markdown files only"
            : "Drop Markdown file to open";
          DOM.dropHint.classList.remove("hidden");
        }

        function setupUpload() {
          DOM.chooseBtn.addEventListener("click", () => DOM.fileInput.click());

          DOM.reuploadBtn.addEventListener("click", () =>
            DOM.fileInputToolbar.click(),
          );

          DOM.fileInput.addEventListener("change", (e) => {
            if (e.target.files.length > 0) loadFile(e.target.files[0]);
            e.target.value = "";
          });

          DOM.fileInputToolbar.addEventListener("change", (e) => {
            if (e.target.files.length > 0) loadFile(e.target.files[0]);
            e.target.value = "";
          });

          const dropZone = DOM.dropZone;
          let dragDepth = 0;

          dropZone.addEventListener("dragenter", (e) => {
            e.preventDefault();
            dragDepth++;
            dropZone.classList.add("dragover");
            updateDropFeedback(e);
          });

          dropZone.addEventListener("dragover", (e) => {
            e.preventDefault();
            dropZone.classList.add("dragover");
            updateDropFeedback(e);
          });

          dropZone.addEventListener("dragleave", (e) => {
            e.preventDefault();
            dragDepth = Math.max(0, dragDepth - 1);
            if (dragDepth === 0) clearDropFeedback();
          });

          dropZone.addEventListener("drop", (e) => {
            e.preventDefault();
            dragDepth = 0;
            clearDropFeedback();
            const files = e.dataTransfer.files;
            if (files.length > 0) loadFile(files[0]);
          });

          DOM.exampleBtn.addEventListener("click", loadExample);
        }

        // ─── SETUP KEYBOARD SHORTCUTS ─────────────────────────────────────────
        function setupKeyboardShortcuts() {
          document.addEventListener("keydown", (e) => {
            if (e.ctrlKey && e.key === "o") {
              e.preventDefault();
              if (DOM.app.classList.contains("visible")) {
                DOM.fileInputToolbar.click();
              } else {
                DOM.fileInput.click();
              }
            }
            if (e.ctrlKey && e.shiftKey && (e.key === "d" || e.key === "D")) {
              e.preventDefault();
              toggleTheme();
            }
          });
        }

        // ─── SETUP EVENT HANDLERS ──────────────────────────────────────────────
        function setupThemeToggle() {
          DOM.themeToggle.addEventListener("click", toggleTheme);
        }

        function setupFullscreen() {
          DOM.fullscreenBtn.addEventListener("click", toggleFullscreen);
          document.addEventListener("fullscreenchange", updateFullscreenButton);
          updateFullscreenButton();
        }

        function setupDownload() {
          DOM.downloadBtn.addEventListener("click", downloadHTML);
        }

        function setupTocToggle() {
          DOM.tocToggle.addEventListener("click", toggleTOCMobile);
          DOM.tocOverlay.addEventListener("click", () => {
            closeTOCMobile();
            DOM.tocToggle.focus();
          });
          document.addEventListener("keydown", (e) => {
            if (e.key === "Escape" && DOM.tocNav.classList.contains("open")) {
              closeTOCMobile();
              DOM.tocToggle.focus();
            }
          });
        }

        // ─── INIT ──────────────────────────────────────────────────────────────
        function init() {
          loadTheme();
          setupUpload();
          setupThemeToggle();
          setupFullscreen();
          setupDownload();
          setupTocToggle();
          setupBackToTop();
          setupKeyboardShortcuts();

          console.log("📄 Markdown Formatter ready");
        }

        // ─── RUN ──────────────────────────────────────────────────────────────
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", init);
        } else {
          init();
        }
      })();
    </script>
  </body>
</html>
